<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fortnite Sprite Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
:root{
  --bg:#1a1b1e;--surface:#25262b;--surface2:#2c2d33;
  --border:#373a40;--border2:#454950;
  --text:#c9cdd3;--text2:#8b949e;--text3:#6e7681;
  --accent:#5865f2;--glow:rgba(88,101,242,.3);
  --gold:#f0b132;--tm:#e67e22;--tm-glow:rgba(230,126,34,.3);
  --c-rare:#4a90d9;--c-epic:#b263f5;--c-legendary:#f0a132;
  --c-mythic:#ff6b35;--c-special:#43b89c;
  --r:10px;--rl:14px;--t:.18s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:14px;min-height:100vh}
/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.hi{max-width:1400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;flex-shrink:0}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#5865f2,#b263f5);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px}
.logo-text{font-size:1.05rem;font-weight:800;color:#fff;letter-spacing:-.3px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:4px 12px;font-size:.76rem;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.chip .v{color:#fff;font-weight:700}
.chip .vg{color:var(--gold);font-weight:700}
.chip .vtm{color:var(--tm);font-weight:700}
.hact{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.ver{font-size:.66rem;font-weight:700;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:999px;padding:3px 9px;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;font-size:.76rem;font-weight:600;cursor:pointer;transition:all var(--t);white-space:nowrap}
.btn:hover{background:var(--border);color:#fff}
.btn-a{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-a:hover{background:#4752c4}
.btn-d{border-color:#e53e3e44;color:#fc8181}
.btn-d:hover{background:#e53e3e22;border-color:#e53e3e88}
.layout-toggle{display:inline-flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:2px;gap:2px}
.layout-toggle .pill{padding:4px 9px;font-size:.7rem}
.layout-toggle .pill.on{background:var(--accent);color:#fff}
/* Dynamic layout: remove the centered 1400px content constraint so the tracker
   uses the full viewport width. This increases packing capacity, especially in
   the adaptive Missing view, while Classic retains the original layout. */
body.dynamic-mode .hi,
body.dynamic-mode .pw,
body.dynamic-mode .tab-bar,
body.dynamic-mode .ctrl,
body.dynamic-mode main{max-width:none;margin-left:0;margin-right:0}
body.dynamic-mode .hi,
body.dynamic-mode .pw,
body.dynamic-mode .tab-bar,
body.dynamic-mode .ctrl,
body.dynamic-mode main{padding-left:0;padding-right:0}
.btn-g{border-color:rgba(67,184,156,.4);color:var(--c-special)}
.btn-g:hover{background:rgba(67,184,156,.1)}
.pw{padding:0 24px 10px;max-width:1400px;margin:0 auto}
.pt{height:3px;background:var(--border);border-radius:4px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--accent),var(--c-special));border-radius:4px;transition:width .5s ease}
/* SEASON TABS */
.tab-bar{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;gap:0;border-bottom:2px solid var(--border)}
.tab-btn{padding:11px 22px;font-family:inherit;font-size:.85rem;font-weight:700;color:var(--text2);background:transparent;border:none;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all var(--t);letter-spacing:.3px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:#fff;border-bottom-color:var(--accent)}
/* CONTROLS */
.ctrl{max-width:1400px;margin:0 auto;padding:14px 24px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cg{display:flex;align-items:center;gap:5px;flex-shrink:0}
.cl{font-size:.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.pg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:2px;gap:1px}
.pill{padding:4px 11px;border-radius:999px;border:none;background:transparent;color:var(--text2);font-family:inherit;font-size:.72rem;font-weight:600;cursor:pointer;transition:all var(--t);white-space:nowrap}
.pill:hover{color:var(--text)}
.pill.on{background:var(--accent);color:#fff}
.pill.on-tm{background:var(--tm);color:#fff}
select{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:.78rem;font-weight:600;padding:5px 9px;cursor:pointer;outline:none}
select:focus{border-color:var(--accent)}
.sw{position:relative;margin-left:auto}
.si{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.si2{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:.78rem;padding:6px 11px 6px 30px;width:180px;outline:none;transition:border-color var(--t),width var(--t)}
.si2:focus{border-color:var(--accent);width:220px}
.si2::placeholder{color:var(--text3)}
/* MAIN CONTENT */
main{max-width:1400px;margin:0 auto;padding:0 24px 60px}
/* GROUP LAYOUT (v1.5.x style) */
.row-wrap{display:flex;gap:16px;margin-bottom:16px;align-items:flex-start}
.tg{flex-shrink:0;min-width:0}
.th{display:flex;flex-direction:column;gap:3px;margin-bottom:8px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.th-top{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden}
.tn{font-size:.82rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;flex-shrink:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tc{font-size:.64rem;font-weight:600;color:var(--text3);background:var(--surface2);border:1px solid var(--border);padding:1px 6px;border-radius:999px;flex-shrink:0;white-space:nowrap}
.tp{font-size:.64rem;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;line-height:1.6}
.tp.done{background:rgba(67,184,156,.15);color:var(--c-special);border:1px solid rgba(67,184,156,.3)}
.tp.part{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.grid{display:flex;flex-wrap:wrap;gap:8px}
/* CARD */
.card{width:148px;flex-shrink:0;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--rl);padding:12px 10px 10px;cursor:pointer;transition:all var(--t);display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;user-select:none}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;border-radius:var(--rl) var(--rl) 0 0;background:var(--rc,transparent)}
.card:hover{border-color:var(--border2);background:var(--surface2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card.own{border-color:var(--accent);background:rgba(88,101,242,.08);box-shadow:0 0 0 1px var(--accent),0 4px 20px var(--glow)}
.card.tm-only{border-color:var(--tm);background:rgba(230,126,34,.07);box-shadow:0 0 0 1px var(--tm),0 4px 20px var(--tm-glow)}
.ob{position:absolute;top:-5px;right:-5px;width:18px;height:18px;background:var(--accent);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:8px;border:2px solid var(--bg);z-index:2}
.card.own .ob{display:flex}
.ob-tm{position:absolute;top:-5px;left:-5px;width:18px;height:18px;background:var(--tm);border-radius:50%;display:none;align-items:center;justify-content:center;font-size:8px;border:2px solid var(--bg);z-index:2}
.card.tm-owned .ob-tm{display:flex}
.iw{width:90px;height:90px;display:flex;align-items:center;justify-content:center}
.img{width:90px;height:90px;object-fit:contain;transition:transform var(--t)}
.card:hover .img{transform:scale(1.1)}
.card.own .img{filter:drop-shadow(0 2px 10px rgba(88,101,242,.5))}
.nm{font-size:.68rem;font-weight:600;color:var(--text);text-align:center;line-height:1.3;width:100%}
.card.own .nm{color:#fff}
.meta{display:flex;align-items:center;justify-content:space-between;width:100%;gap:3px}
.rb{font-size:.6rem;font-weight:700;text-transform:capitalize;padding:2px 5px;border-radius:4px;color:#fff;flex-shrink:0}
.dr{font-size:.6rem;color:var(--text3);font-weight:500}
.lr{display:flex;align-items:center;gap:3px;width:100%}
.ll{font-size:.6rem;color:var(--text3);font-weight:500;flex-shrink:0}
.lc{display:flex;align-items:center;gap:2px;margin-left:auto}
.lb{width:19px;height:19px;border-radius:4px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:13px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all var(--t);font-weight:700;flex-shrink:0}
.lb:hover:not(:disabled){background:var(--border2);color:#fff}
.lb:disabled{opacity:.3;cursor:default}
.lv{font-size:.72rem;font-weight:700;color:#fff;min-width:17px;text-align:center}
.cr{display:flex;align-items:center;justify-content:space-between;width:100%;margin-top:2px;gap:3px}
.cb-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.cb-lbl{font-size:.5rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.3px;line-height:1}
.cb{width:19px;height:19px;border-radius:4px;border:2px solid var(--border2);background:transparent;display:flex;align-items:center;justify-content:center;transition:all var(--t);flex-shrink:0}
.card.own .cb.mine{background:var(--accent);border-color:var(--accent)}
.card.tm-owned .cb.teammate{background:var(--tm);border-color:var(--tm)}
.cb svg{display:none}
.card.own .cb.mine svg,.card.tm-owned .cb.teammate svg{display:block}
.st{font-size:.56rem;font-weight:700;color:var(--gold);background:rgba(240,177,50,.12);border:1px solid rgba(240,177,50,.3);padding:1px 4px;border-radius:3px;text-transform:uppercase}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:500;display:none;align-items:center;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:26px;width:min(480px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal h2{font-size:1.05rem;font-weight:800;color:#fff;margin-bottom:18px;display:flex;align-items:center;gap:9px}
.setting-row{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-of-type{border-bottom:none;padding-bottom:0}
.setting-info{flex:1}
.setting-title{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:3px}
.setting-desc{font-size:.73rem;color:var(--text2);line-height:1.4}
.setting-name-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.setting-name-row input{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:.8rem;padding:4px 9px;width:130px;outline:none}
.setting-name-row input:focus{border-color:var(--tm)}
.toggle{position:relative;width:42px;height:23px;flex-shrink:0;margin-top:3px}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle-track{position:absolute;inset:0;background:var(--border2);border-radius:999px;cursor:pointer;transition:background var(--t)}
.toggle input:checked~.toggle-track{background:var(--tm)}
.toggle-thumb{position:absolute;top:3px;left:3px;width:17px;height:17px;background:#fff;border-radius:50%;transition:transform var(--t);pointer-events:none}
.toggle input:checked~.toggle-track~.toggle-thumb{transform:translateX(19px)}
.modal-foot{display:flex;justify-content:flex-end;margin-top:18px}
.export-opt-btn{display:flex;align-items:center;gap:13px;width:100%;padding:12px 15px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface2);color:var(--text);font-family:inherit;cursor:pointer;transition:all var(--t);text-align:left}
.export-opt-btn:hover{border-color:var(--accent);background:rgba(88,101,242,.08);color:#fff}
.export-icon{font-size:1.3rem;flex-shrink:0;width:30px;text-align:center}
.export-opt-info{flex:1;min-width:0}
.export-opt-title{font-size:.85rem;font-weight:700;color:#fff;margin-bottom:2px}
.export-opt-desc{font-size:.71rem;color:var(--text2)}
.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty h3{font-size:1.05rem;color:var(--text2);margin-bottom:7px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--surface);border:1px solid var(--accent);color:var(--text);padding:9px 18px;border-radius:var(--r);font-size:.8rem;font-weight:600;opacity:0;transition:all .3s;z-index:999;box-shadow:0 4px 18px rgba(0,0,0,.4);pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
</style>
</head>
<body>

<!-- SETTINGS MODAL -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <h2>⚙️ Settings</h2>
    <div class="setting-row">
      <div class="setting-info">
        <div class="setting-title">Teammate Tracker</div>
        <div class="setting-desc">Show a second checkbox to track your teammate's sprites. Enables teammate-based filters.</div>
        <div class="setting-name-row" id="tmNameRow" style="display:none">
          <span style="font-size:.76rem;color:var(--text2)">Label:</span>
          <input id="tmNameInput" type="text" maxlength="20" placeholder="Teammate" oninput="onTmNameChange()">
        </div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="tmToggle" onchange="onTmToggle()">
        <div class="toggle-track"></div>
        <div class="toggle-thumb"></div>
      </label>
    </div>
    <div class="modal-foot">
      <button class="btn btn-a" onclick="closeSettings()">Done</button>
    </div>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal-bg" id="exportModal" onclick="if(event.target===this)closeExport()">
  <div class="modal" style="max-width:380px">
    <h2>⬇ Export Progress</h2>
    <p style="font-size:.78rem;color:var(--text2);margin-bottom:16px">Exports the active season tab data.</p>
    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="export-opt-btn" onclick="doExport('mine')">
        <span class="export-icon">👤</span>
        <div class="export-opt-info"><div class="export-opt-title">My Sprites</div><div class="export-opt-desc">Your owned status and levels only</div></div>
      </button>
      <button class="export-opt-btn" onclick="doExport('teammate')">
        <span class="export-icon">🤝</span>
        <div class="export-opt-info"><div class="export-opt-title">Teammate's Sprites</div><div class="export-opt-desc">Your teammate's owned status only</div></div>
      </button>
      <button class="export-opt-btn" onclick="doExport('share-as-teammate')">
        <span class="export-icon">🔁</span>
        <div class="export-opt-info"><div class="export-opt-title">Share Mine as Teammate</div><div class="export-opt-desc">Export your sprites so a friend can import them as teammate data</div></div>
      </button>
      <button class="export-opt-btn" onclick="doExport('all')">
        <span class="export-icon">📦</span>
        <div class="export-opt-info"><div class="export-opt-title">Everything</div><div class="export-opt-desc">All data including settings</div></div>
      </button>
    </div>
    <div class="modal-foot" style="margin-top:16px">
      <button class="btn" onclick="closeExport()">Cancel</button>
    </div>
  </div>
</div>

<header>
  <div class="hi">
    <div class="logo">
      <div class="logo-icon">👾</div>
      <div class="logo-text">Fortnite Sprite Tracker</div>
    </div>
    <div class="stats">
      <div class="chip">Mine <span class="v" id="sOwn">0</span>&thinsp;/&thinsp;<span class="v" id="sTotal">0</span></div>
      <div class="chip">Levels <span class="vg" id="sLvl">0</span>&thinsp;/&thinsp;<span class="v" id="sMaxLvl">0</span></div>
      <div class="chip"><span class="v" id="sPct">0%</span> complete</div>
      <div class="chip" id="tmChip" style="display:none"><span id="tmChipLabel">Teammate</span>&nbsp;<span class="vtm" id="sTm">0</span>&thinsp;/&thinsp;<span class="v" id="sTmTotal">0</span></div>
    </div>
    <div class="hact">
      <span class="ver">v2.3.8</span>
      <div class="layout-toggle" role="group" aria-label="Layout mode">
        <button class="pill" id="layoutClassic" onclick="setLayoutMode('classic')">Classic</button>
        <button class="pill" id="layoutDynamic" onclick="setLayoutMode('dynamic')">Dynamic</button>
      </div>
      <button class="btn btn-a" onclick="openExport()">⬇ Export</button>
      <button class="btn" onclick="importData()">⬆ Import</button>
      <button class="btn btn-g" onclick="openSettings()">⚙️ Settings</button>
      <button class="btn btn-d" onclick="resetAll()">✕ Reset</button>
    </div>
  </div>
  <div class="pw"><div class="pt"><div class="pf" id="pf" style="width:0%"></div></div></div>
</header>

<!-- SEASON TABS -->
<div class="tab-bar">
  <button class="tab-btn" id="tabS3" onclick="switchSeason('s3')">CH7 S3</button>
  <button class="tab-btn active" id="tabS4" onclick="switchSeason('s4')">CH7 S4</button>
</div>

<div class="ctrl">
  <div class="cg">
    <span class="cl">Show</span>
    <div class="pg" id="showPills">
      <button class="pill on" data-own="all"          onclick="setF('own','all',this)">All</button>
      <button class="pill"    data-own="owned"         onclick="setF('own','owned',this)">Owned</button>
      <button class="pill"    data-own="missing"       onclick="setF('own','missing',this)">Missing</button>
      <button class="pill"    data-own="tm-missing"    id="tmMissingPill"  style="display:none" onclick="setF('own','tm-missing',this)">Teammate Missing</button>
      <button class="pill"    data-own="i-have-tm-not" id="iHaveTmNotPill" style="display:none" onclick="setF('own','i-have-tm-not',this)">I Have, Teammate Doesn’t</button>
      <button class="pill"    data-own="tm-has-i-not"  id="tmHasINotPill"  style="display:none" onclick="setF('own','tm-has-i-not',this)">Teammate Has, I Don’t</button>
    </div>
  </div>
  <div class="cg">
    <span class="cl">Variant</span>
    <div class="pg" id="varPills"><!-- built by JS per season --></div>
  </div>
  <div class="cg">
    <span class="cl">Sort</span>
    <select id="srt" onchange="render()">
      <option value="type">By Type</option>
      <option value="rarity">By Rarity</option>
      <option value="name">By Name</option>
    </select>
  </div>
  <div class="sw">
    <svg class="si" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input class="si2" id="srch" type="text" placeholder="Search sprites…" oninput="render()">
  </div>
</div>

<main id="main"></main>
<div id="toast"></div>
<input type="file" id="ifile" accept=".json" style="display:none" onchange="handleImport(event)">

<script>
// ── S3 DATA ───────────────────────────────────────────────────────────────

const ASSET_ROOT = './sprites/';
const ASSET_OVERRIDES = {
  118: "Peeky Peely Sprite.webp", // s3: Peely Sprite,
  119: "Gold Peeky Peely Sprite.webp", // s3: Gold Peely Sprite,
  120: "Gummy Peeky Peely Sprite.webp", // s3: Gummy Peely Sprite,
  121: "Galaxy Peeky Peely Sprite.webp", // s3: Galaxy Peely Sprite,
  122: "Holofoil Peeky Peely Sprite.webp", // s3: Holofoil Peely Sprite,
  241: "Cheatmaster Onigiri Sprite.webp", // s4: Cheat Master Onigiri Sprite,
  244: "Cheatmaster X-Ray Sprite.webp", // s4: Cheat Master X-Ray Sprite
};

function spriteURL(sk, sp) {
  const filename = ASSET_OVERRIDES[sp.id] || (sp.name + '.webp');
  return ASSET_ROOT + sk + '/' + encodeURIComponent(filename);
}

const SPRITES_S3 = [
  {id:1, name:"Water Sprite", type:"Water", variant:"Base", rarity:"rare", drop:"8.88%", starter:true},
  {id:4, name:"Gold Water Sprite", type:"Water", variant:"Gold", rarity:"special", drop:"0.7%", starter:false},
  {id:2, name:"Gummy Water Sprite", type:"Water", variant:"Candy", rarity:"special", drop:"4.23%", starter:false},

// ── STATE ──────────────────────────────────────────────────────────────────
function loadSeasonState(sk) {
  // sk is the season code ('s3' or 's4')
  const KEY = SEASONS[sk].KEY;
  try {
    const r = localStorage.getItem(KEY);
    if (r) return JSON.parse(r);
  } catch(e) {}

  // Migration: v1.x saved S3 data under 'fnSprites_v3' — import it into the new key
  if (sk === 's3') {
    try {
      const old = localStorage.getItem('fnSprites_v3');
      if (old) {
        const parsed = JSON.parse(old);
        localStorage.setItem(KEY, JSON.stringify(parsed)); // migrate to new key
        return parsed;
      }
    } catch(e) {}
  }

  // Fresh state
  const s = {};
  SEASONS[sk].SPRITES.forEach(sp => s[sp.id] = {owned:false, level:0, tmOwned:false});
  return s;
}
function saveSeason(sk) {
  // sk is the season code ('s3' or 's4')
  localStorage.setItem(SEASONS[sk].KEY, JSON.stringify(state[sk]));
}
function ens(sk, id) {
  if(!state[sk]) state[sk]={};
  if(!state[sk][id]) state[sk][id]={owned:false,level:0,tmOwned:false};
  if(state[sk][id].tmOwned===undefined) state[sk][id].tmOwned=false;
}
function loadSettings(){
  try{const r=localStorage.getItem(SKEY);if(r)return JSON.parse(r);}catch(e){}
  return {tmEnabled:false,tmName:'Teammate',showProgress:true,layoutMode:'classic'};
}
function saveSettings(){localStorage.setItem(SKEY,JSON.stringify(settings));}
function applyLayoutMode(){
  const mode=settings.layoutMode==='dynamic'?'dynamic':'classic';
  document.body.classList.toggle('dynamic-mode',mode==='dynamic');
  document.getElementById('layoutClassic')?.classList.toggle('on',mode==='classic');
  document.getElementById('layoutDynamic')?.classList.toggle('on',mode==='dynamic');
}
function setLayoutMode(mode){
  settings.layoutMode=mode==='dynamic'?'dynamic':'classic';
  saveSettings();
  applyLayoutMode();
  render();
}

function initState(){
  state.s3 = loadSeasonState('s3');
  state.s4 = loadSeasonState('s4');
  // Ensure all IDs exist
  Object.keys(SEASONS).forEach(sk=>{
    SEASONS[sk].SPRITES.forEach(sp=>ens(sk,sp.id));

}

// ── LAYOUT HELPERS ─────────────────────────────────────────────────────────
function groupMinWidth(n){return n*CARD_W+(n-1)*CARD_GAP;}
function packGroups(groups, availWidth){
  const rows=[];let i=0;
  while(i<groups.length){
    const row=[];let used=0;
    while(i<groups.length){
      const minW=groupMinWidth(groups[i].sprites.length);
      const needed=row.length===0?minW:minW+GROUP_GAP;
      if(row.length===0||used+needed<=availWidth){used+=needed;row.push(groups[i]);i++;}
      else break;
    }
    rows.push(row);
  }
  return rows;
}

// Missing views are sparse: category widths change with ownership, so the
// normal type order can leave avoidable holes at the end of rows.  Reorder
// whole category groups using best-fit decreasing so each row is packed more
// tightly while keeping every category together.  Ties retain the normal
// category order for a stable UI.
function packGroupsForMissing(groups, availWidth){
  const sorted=groups.map((g,i)=>({g,i,w:groupMinWidth(g.sprites.length)}))
    .sort((a,b)=>b.w-a.w||a.i-b.i);
  const rows=[];
  sorted.forEach(item=>{
    let best=-1,bestRemaining=Infinity;
    rows.forEach((r,idx)=>{
      const needed=item.w+(r.groups.length?GROUP_GAP:0);
      const remaining=availWidth-(r.used+needed);
      if(remaining>=0 && remaining<bestRemaining){best=idx;bestRemaining=remaining;}
    });
    if(best<0){
      rows.push({groups:[item.g],used:item.w});
    }else{
      const r=rows[best];
      r.groups.push(item.g);
      r.used+=item.w+GROUP_GAP;
    }
  });
  return rows.map(r=>r.groups);
}

// ── RENDER ─────────────────────────────────────────────────────────────────
function render(){
  const sk=curSeason, season=SEASONS[sk];
  const SPRITES=season.SPRITES, TI=season.TI;
  const pinnedLast=season.pinnedLast;
  const own=F.own, vnt=F.var, srt=document.getElementById('srt').value;
  const q=document.getElementById('srch').value.trim().toLowerCase();
  const isFiltered=(own!=='all'||vnt!=='All'||q.length>0);

  let list=SPRITES.filter(sp=>{
    ens(sk,sp.id);
    const s=state[sk][sp.id];
    if(own==='owned'         &&!s.owned)                           return false;
    if(own==='missing'       && s.owned)                           return false;
    if(own==='tm-missing'    &&(s.tmOwned||!settings.tmEnabled))   return false;
    if(own==='i-have-tm-not' &&(!s.owned||s.tmOwned||!settings.tmEnabled))  return false;
    if(own==='tm-has-i-not'  &&(!s.tmOwned||s.owned||!settings.tmEnabled))  return false;
    if(vnt!=='All'           && sp.variant!==vnt)                  return false;
    if(q&&!sp.name.toLowerCase().includes(q)&&!sp.type.toLowerCase().includes(q)) return false;
    return true;
  });

  if(srt==='rarity') list.sort((a,b)=>(RO[a.rarity]??9)-(RO[b.rarity]??9)||a.name.localeCompare(b.name));
  else if(srt==='name') list.sort((a,b)=>a.name.localeCompare(b.name));

  const container=document.getElementById('main');
  container.innerHTML='';
  if(!list.length){
    container.innerHTML='<div class="empty"><h3>No sprites found</h3><p>Try adjusting your filters.</p></div>';
    updStats();return;
  }

  const typeOrder=[...new Set(SPRITES.map(s=>s.type))].filter(t=>!pinnedLast.includes(t));
  pinnedLast.forEach(t=>typeOrder.push(t));
  const groupList=[];
  typeOrder.forEach(t=>{
    const g=list.filter(sp=>sp.type===t);
    if(g.length) groupList.push({type:t,sprites:g});
  });

  const availWidth=container.clientWidth||1350;

  if(!isFiltered){
    // All: natural widths — each group gets exactly enough width for its cards on one line
    const rows=packGroups(groupList,availWidth);
    rows.forEach(row=>{
      const rowDiv=document.createElement('div');rowDiv.className='row-wrap';
      row.forEach(({type:t,sprites:g})=>{
        const natW=groupMinWidth(g.length);
        const sec=buildGroup(sk,t,g,natW,TI,false);
        rowDiv.appendChild(sec);
      });
      container.appendChild(rowDiv);
    });
  } else {
    // Filtered: natural widths, no internal wrap. Missing is sparse, so
    // dynamically repack its category groups to minimize row waste.
    const rows=own==='missing' ? packGroupsForMissing(groupList,availWidth) : packGroups(groupList,availWidth);
    rows.forEach(row=>{
      const rowDiv=document.createElement('div');rowDiv.className='row-wrap';
      row.forEach(({type:t,sprites:g})=>{
        const natW=groupMinWidth(g.length);
        const sec=buildGroup(sk,t,g,natW,TI,false);
        rowDiv.appendChild(sec);
      });
      container.appendChild(rowDiv);
    });
  }

  updStats();
}

function buildGroup(sk,t,g,groupW,TI,allowWrap){
  const oc=g.filter(s=>state[sk][s.id]?.owned).length;
  const toc=g.filter(s=>state[sk][s.id]?.tmOwned).length;
  const tid='tp_'+sk+'_'+t.replace(/[^a-z0-9]/gi,'_');
  const sec=document.createElement('div');
  sec.className='tg';sec.style.width=groupW+'px';sec.style.flexShrink='0';
  let prog='';
  if(settings.showProgress!==false){
    prog=`<div class="tp ${oc===g.length?'done':'part'}" id="${tid}">Me: ${oc}/${g.length}`;
    if(settings.tmEnabled) prog+=` &nbsp;|&nbsp; ${settings.tmName||'Tm'}: ${toc}/${g.length}`;
    prog+=`</div>`;
  } else {
    prog=`<div id="${tid}" style="display:none"></div>`;
  }
  sec.innerHTML=`<div class="th"><div class="th-top"><div class="tn">${TI[t]||'👾'} ${t}</div><div class="tc">${g.length} variants</div></div>${prog}</div>`;
  const grd=document.createElement('div');
  grd.className='grid';
  grd.style.width=groupW+'px';
  if(!allowWrap) grd.style.flexWrap='nowrap';
  g.forEach(sp=>grd.appendChild(mkCard(sk,sp)));
  sec.appendChild(grd);
  return sec;
}

function mkCard(sk,sp){
  ens(sk,sp.id);
  const s=state[sk][sp.id], c=RC[sp.rarity]||'#666';
  const tmOn=settings.tmEnabled, tmName=settings.tmName||'Teammate';
  const lbl=tmName.length>5?tmName.slice(0,5)+'…':tmName;
  let cls='card';
  if(s.owned) cls+=' own';
  if(s.tmOwned) cls+=' tm-owned';
  if(!s.owned&&s.tmOwned) cls+=' tm-only';
  const card=document.createElement('div');
  card.className=cls;card.dataset.id=sp.id;card.dataset.sk=sk;
  card.style.setProperty('--rc',c);
  const cbRow=tmOn
    ?`<div class="cr"><div class="cb-wrap"><div class="cb mine">${CHKSVG}</div><div class="cb-lbl">Me</div></div>${sp.starter?'<span class="st">Start</span>':'<span></span>'}<div class="cb-wrap"><div class="cb teammate">${CHKSVG}</div><div class="cb-lbl">${lbl}</div></div></div>`
    :`<div class="cr"><div class="cb mine">${CHKSVG}</div>${sp.starter?'<span class="st">Starter</span>':'<span></span>'}</div>`;
  card.innerHTML=`
    <div class="ob">✓</div>
    ${tmOn?'<div class="ob-tm">✓</div>':''}
    <div class="iw"><img class="img" src="${spriteURL(sk,sp)}" alt="${sp.name}" loading="lazy"></div>
    <div class="nm">${sp.name}</div>
    <div class="meta"><span class="rb" style="background:${c}">${sp.rarity}</span><span class="dr">${sp.drop}</span></div>
    <div class="lr"><span class="ll">Lvl</span>
      <div class="lc">
        <button class="lb" onclick="chgLvl(event,'${sk}',${sp.id},-1)" ${s.level<=0?'disabled':''}>−</button>
        <span class="lv" id="lv_${sk}_${sp.id}">${s.level}</span>
        <button class="lb" onclick="chgLvl(event,'${sk}',${sp.id},+1)" ${s.level>=MAX_LVL?'disabled':''}>+</button>
      </div>
    </div>
    ${cbRow}`;
  card.addEventListener('click',e=>{
    if(e.target.closest('.lb'))return;
    if(tmOn&&e.target.closest('.cb.teammate')){toggleTm(sk,sp.id,card);return;}
    toggleMine(sk,sp.id,card);
  });
  return card;
}

function toggleMine(sk,id,card){ens(sk,id);state[sk][id].owned=!state[sk][id].owned;updCardCls(card,sk,id);saveSeason(sk);updStats();updHeaders();}
function toggleTm(sk,id,card){ens(sk,id);state[sk][id].tmOwned=!state[sk][id].tmOwned;updCardCls(card,sk,id);saveSeason(sk);updStats();updHeaders();}
function updCardCls(card,sk,id){
  const s=state[sk][id];
  card.classList.toggle('own',s.owned);
  card.classList.toggle('tm-owned',s.tmOwned);
  card.classList.toggle('tm-only',!s.owned&&s.tmOwned);
}
function chgLvl(e,sk,id,d){
  e.stopPropagation();ens(sk,id);
  const nv=Math.max(0,Math.min(MAX_LVL,state[sk][id].level+d));
  state[sk][id].level=nv;
  if(nv>0&&!state[sk][id].owned){state[sk][id].owned=true;updCardCls(e.target.closest('.card'),sk,id);}
  document.getElementById('lv_'+sk+'_'+id).textContent=nv;
  const bs=e.target.closest('.lc').querySelectorAll('.lb');
  bs[0].disabled=nv<=0;bs[1].disabled=nv>=MAX_LVL;
  saveSeason(sk);updStats();updHeaders();
}
function updHeaders(){
  const sk=curSeason;
  document.querySelectorAll('.tg').forEach(grp=>{
    const cards=grp.querySelectorAll('.card');
    const tot=cards.length;
    const oc=[...cards].filter(c=>c.classList.contains('own')).length;
    const toc=[...cards].filter(c=>c.classList.contains('tm-owned')).length;
    const tn=grp.querySelector('.tn')?.textContent?.replace(/^../,'').trim()||'';
    const el=document.getElementById('tp_'+sk+'_'+tn.replace(/[^a-z0-9]/gi,'_'));
    if(!el)return;
    if(settings.showProgress===false){el.style.display='none';return;}
    el.style.display='';
    let txt='Me: '+oc+'/'+tot;
    if(settings.tmEnabled) txt+=' &nbsp;|&nbsp; '+(settings.tmName||'Tm')+': '+toc+'/'+tot;
    el.innerHTML=txt;
    el.className='tp '+(oc===tot?'done':'part');
  });
}
function updStats(){
  const sk=curSeason, SPRITES=SEASONS[sk].SPRITES;
  const total=SPRITES.length;
  const oc=SPRITES.filter(sp=>state[sk][sp.id]?.owned).length;
  const tc=SPRITES.filter(sp=>state[sk][sp.id]?.tmOwned).length;
  const tl=SPRITES.reduce((s,sp)=>s+(state[sk][sp.id]?.level||0),0);
  document.getElementById('sOwn').textContent=oc;
  document.getElementById('sTotal').textContent=total;
  document.getElementById('sLvl').textContent=tl;
  document.getElementById('sMaxLvl').textContent=total*MAX_LVL;
  document.getElementById('sTm').textContent=tc;
  document.getElementById('sTmTotal').textContent=total;
  document.getElementById('sPct').textContent=Math.round(oc/total*100)+'%';
  document.getElementById('pf').style.width=Math.round(oc/total*100)+'%';
}
function setF(k,v,btn){
  F[k]=v;
  btn.closest('.pg').querySelectorAll('.pill').forEach(p=>p.classList.remove('on','on-tm'));
  const tmStyled=['tm-missing','i-have-tm-not','tm-has-i-not'].includes(v);
  btn.classList.add(tmStyled?'on-tm':'on');
  render();
}

// ── EXPORT / IMPORT ────────────────────────────────────────────────────────
function openExport(){document.getElementById('exportModal').classList.add('open');}
function closeExport(){document.getElementById('exportModal').classList.remove('open');}
function doExport(type){
  closeExport();
  const sk=curSeason, KEY=SEASONS[sk].KEY, SPRITES=SEASONS[sk].SPRITES;
  const date=new Date().toISOString().slice(0,10);
  let data, filename;
  if(type==='mine'){
    const mine={};SPRITES.forEach(sp=>{ens(sk,sp.id);mine[sp.id]={owned:state[sk][sp.id].owned,level:state[sk][sp.id].level};});
    data={version:APP_VER,exportType:'mine',season:sk,savedAt:new Date().toISOString(),sprites:mine};
    filename='fortnite-sprites-'+sk+'-mine-'+date+'.json';
  }else if(type==='teammate'){
    const tm={};SPRITES.forEach(sp=>{ens(sk,sp.id);tm[sp.id]={tmOwned:state[sk][sp.id].tmOwned};});
    data={version:APP_VER,exportType:'teammate',season:sk,savedAt:new Date().toISOString(),sprites:tm};
    filename='fortnite-sprites-'+sk+'-teammate-'+date+'.json';
  }else if(type==='share-as-teammate'){
    const shared={};SPRITES.forEach(sp=>{ens(sk,sp.id);shared[sp.id]={tmOwned:state[sk][sp.id].owned};});
    data={version:APP_VER,exportType:'teammate',season:sk,savedAt:new Date().toISOString(),sprites:shared};
    filename='fortnite-sprites-'+sk+'-shared-'+date+'.json';
  }else{
    data={version:APP_VER,exportType:'all',season:sk,savedAt:new Date().toISOString(),sprites:{s3:state.s3,s4:state.s4},settings};
    filename='fortnite-sprites-all-'+date+'.json';
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();
  const labels={mine:'My Sprites',teammate:"Teammate's Sprites",'share-as-teammate':'Shared as Teammate',all:'Everything'};
  toast('Exported: '+(labels[type]||type)+' ✅');
}
function importData(){document.getElementById('ifile').click();}
function handleImport(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.sprites){toast('Import failed \u2013 invalid file');return;}
      const exportType=d.exportType||'all';

      // v1.x exports have no 'season' field and version < 2 — always map to S3
      const isV1 = !d.season && (!d.version || !String(d.version).startsWith('2'));
      const sk = isV1 ? 's3' : (d.season||curSeason);

      if(exportType==='mine'){
        Object.entries(d.sprites).forEach(([id,v])=>{ens(sk,id);state[sk][id].owned=v.owned??state[sk][id].owned;state[sk][id].level=v.level??state[sk][id].level;});
        SEASONS[sk].SPRITES.forEach(sp=>ens(sk,sp.id));
        saveSeason(sk);render();toast('Imported: My Sprites \u2192 '+SEASONS[sk].label+' \u2705');
      }else if(exportType==='teammate'){
        Object.entries(d.sprites).forEach(([id,v])=>{ens(sk,id);state[sk][id].tmOwned=v.tmOwned??state[sk][id].tmOwned;});
        SEASONS[sk].SPRITES.forEach(sp=>ens(sk,sp.id));
        saveSeason(sk);render();toast('Imported: Teammate \u2192 '+SEASONS[sk].label+' \u2705');
      }else{
        // 'all' — v2.x has {s3,s4}, v1.x is a flat sprites object
        if(d.sprites.s3||d.sprites.s4){
          if(d.sprites.s3){state.s3=d.sprites.s3;SEASONS.s3.SPRITES.forEach(sp=>ens('s3',sp.id));saveSeason('s3');}
          if(d.sprites.s4){state.s4=d.sprites.s4;SEASONS.s4.SPRITES.forEach(sp=>ens('s4',sp.id));saveSeason('s4');}
        }else{
          // v1.x flat export — load into S3
          state.s3=d.sprites;SEASONS.s3.SPRITES.forEach(sp=>ens('s3',sp.id));saveSeason('s3');
        }
        if(d.settings){settings=Object.assign(loadSettings(),d.settings);saveSettings();}
        applyLayoutMode();applyTmUI();render();toast('Imported: Everything \u2705');
      }
    }catch(err){toast('Import failed \u2013 invalid file');}
    e.target.value='';
  };
  reader.readAsText(file);
}
function resetAll(){
  const sk=curSeason;
  if(!confirm('Reset '+SEASONS[sk].label+' progress? Settings are kept.'))return;
  SEASONS[sk].SPRITES.forEach(sp=>{state[sk][sp.id]={owned:false,level:0,tmOwned:false};});
  saveSeason(sk);render();toast('Reset complete');
}
function toast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2700);
}
window.addEventListener('resize',()=>{clearTimeout(window._rt);window._rt=setTimeout(render,150);});

// ── INIT ───────────────────────────────────────────────────────────────────
initState();
applyLayoutMode();
applyTmUI();
buildVariantPills();
// Default to S4 tab
document.getElementById('tabS3').classList.remove('active');
document.getElementById('tabS4').classList.add('active');
render();
</script>
</body>
