<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Index</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        ul { list-style-type: none; padding-left: 0; }
        li { margin: 5px 0; }
        a { text-decoration: none; color: #0366d6; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>File Directory</h1>
    <ul id="file-list">Loading files...</ul>

    <script>
        // Replace with your GitHub username and repository name
        const USER = 'robertduggan';
        const REPO = 'fortnite-sprites-assets';
        
        async function loadFiles() {
            const listElement = document.getElementById('file-list');
            try {
                // Fetch repository structure from the public GitHub API
                const response = await fetch(`https://github.com{USER}/${REPO}/contents/`);
                const files = await response.json();
                
                listElement.innerHTML = ''; // Clear loading text

                files.forEach(file => {
                    // Skip the index.html file itself or hidden files
                    if (file.name === 'index.html' || file.name.startsWith('.')) return;

                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    
                    // Link to the relative path so it loads via GitHub Pages
                    a.href = `./${file.path}`;
                    a.textContent = file.name;
                    
                    li.appendChild(a);
                    listElement.appendChild(li);
                });
            } catch (error) {
                listElement.innerHTML = '<li>Error loading directory files.</li>';
                console.error(error);
            }
        }

        loadFiles();
    </script>
</body>
</html>
